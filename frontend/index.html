<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My First Web Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 40px;
        }

        h1 {
            background-color: blueviolet;
            color: white;
            padding: 16px;
            border-radius: 8px;
        }

        p {
            background-color: chartreuse;
            padding: 12px;
            border-radius: 8px;
        }

        button {
            display: block;
            margin-top: 20px;
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background-color: black;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #444;
        }
    </style>
</head>

<body>
    <h1>
        My first Heading
    </h1>
    <p>
        My first paragraph
    </p>
    <a href="https://en.wikipedia.org/wiki/Main_Page">Wikipedia Link</a>

    <br><br>
    <button onclick="openAnalyzeDishPage()">
        Analyze Dish
    </button>

    <script>
        function openAnalyzeDishPage() {
            window.location.href = "https://maunikagowardhan.co.uk/cook-in-a-curry/";
        }
    </script>
</body>

</html>
