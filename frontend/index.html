<!doctype html>
<html>
  <head>
    <title>Recipe Assistant</title>
    <meta charset="UTF-8" />
    <style>
      /* Add your CSS styles here */
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
      }
      header {
        background-color: #fff3d6;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        padding: 12px 24px;
      }
      main {
        background-color: #e6f7ff;
        padding: 20px;
        min-height: 400px;
      }
      footer {
        background-color: #eeeeee;
        padding: 20px;
        text-align: center;
      }
      .header-left {
        justify-self: start;
      }

      .header-center {
        justify-self: center;
      }

      .header-center h1 {
        margin: 0;
      }

      .header-right {
        justify-self: end;
        display: flex;
        gap: 10px;
      }

      .header-right button {
        padding: 8px 14px;
        border: 1px solid #b45309;
        border-radius: 6px;
        background-color: white;
        color: #b45309;
        cursor: pointer;
      }

      .logo {
        width: 120px;
        height: auto;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-left">
        <img
          class="logo"
          src="assets/images/logo.png"
          alt="Recipe Assistant Logo"
        />
      </div>
      <div class="header-center">
        <h1>Welcome to Recipe Assistant</h1>
      </div>
      <div class="header-right">
        <button>Facebook</button>
        <button>Instagram</button>
        <button>Twitter</button>
      </div>
    </header>
    <main>
      <h1>Main section</h1>
      <p>This is the main section of the page.</p>
    </main>
    <footer>
      <p>2026 Recipe Assistant. All rights reserved.</p>
    </footer>
  </body>
</html>
