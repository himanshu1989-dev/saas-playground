<!doctype html>
<html>
  <head>
    <title>Recipe Assistant</title>
    <meta charset="UTF-8" />
    <style>
      /* Add your CSS styles here */
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
      }
      header {
        background-color: #f3f7df;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        padding: 12px 24px;
      }
      main {
        background-color: #e6f7ff;
        padding: 20px;
        min-height: 400px;
      }
      footer {
        background-color: #eeeeee;
        padding: 20px;
        text-align: left;
      }
      .header-left {
        justify-self: start;
      }

      .header-center {
        justify-self: center;
      }

      .header-center h1 {
        margin: 0;
        font-size: 48px;
        font-family: "Lucida Handwriting", "Segoe Script", cursive;
        font-weight: normal;
        color: #8f0303;
      }

      .header-right {
        justify-self: end;
        display: flex;
        gap: 10px;
      }

      .header-right-side-icon {
        border: none;
        background-color: white;
        padding: 8px;
        border-radius: 50%;
        cursor: pointer;
      }

      .header-right-side-icon img {
        width: 24px;
        height: 24px;
        display: block;
      }

      .logo {
        width: 140px;
        height: auto;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-left">
        <img
          class="logo"
          src="assets/images/logo.png"
          alt="Recipe Assistant Logo"
        />
      </div>
      <div class="header-center">
        <h1>Welcome to Recipe Assistant</h1>
      </div>
      <div class="header-right">
        <button class="header-right-side-icon">
          <img src="assets/images/facebook.png" alt="Facebook" />
        </button>
        <button class="header-right-side-icon">
          <img src="assets/images/instagram.png" alt="Instagram" />
        </button>
        <button class="header-right-side-icon">
          <img src="assets/images/twitter-x.png" alt="Twitter" />
        </button>
      </div>
    </header>
    <main>
      <h1>Main section</h1>
      <p>This is the main section of the page.</p>
    </main>
    <footer>
      <p>2026 Recipe Assistant. All rights reserved.</p>
    </footer>
  </body>
</html>
