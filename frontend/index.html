<!DOCTYPE html>
<html lang="en">

<head>
    <title>Recipe Assistant</title>
    <meta charset="UTF-8">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }

        .site-header {
            padding: 16px 40px;
            background-color: white;
            border-bottom: 1px solid #ddd;
        }

        .site-footer {
            padding: 16px 40px;
            background-color: white;
            border-top: 1px solid #ddd;
            text-align: center;
        }

        main {
            min-height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .analyze-button {
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            background-color: #b45309;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .analyze-button:hover {
            background-color: #92400e;
        }
    </style>
</head>

<body>

    <header class="site-header">
        <h1>Recipe Assistant</h1>
    </header>

    <main>
        <button class="analyze-button">
            Analyze Dish
        </button>
    </main>

    <footer class="site-footer">
        <p>Created by me while learning frontend.</p>
    </footer>

</body>

</html>
